name: CI Frontend

on:
  pull_request:
    branches:
      - develop
      - main
      - release
  push:
    branches:
      - develop
      - main
      - release
  workflow_dispatch:
    inputs:
      build_android:
        description: Generar AAB firmado de produccion
        required: true
        default: false
        type: boolean

jobs:
  validate-release-source:
    name: Validación de Rama de Release hacia Main
    runs-on: ubuntu-latest
    steps:
      - name: Validar origen de Pull Request
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          echo "Evaluando contexto del evento..."
          echo "Evento: $EVENT_NAME"
          echo "Rama base: $BASE_REF"
          echo "Rama origen: $HEAD_REF"

          # 1. Si no es un Pull Request hacia main, la validación de release no aplica
          if [ "$EVENT_NAME" != "pull_request" ] || [ "$BASE_REF" != "main" ]; then
            echo "La validación de origen para 'main' no aplica para el evento '$EVENT_NAME' con destino '$BASE_REF'."
            echo "Comprobación completada exitosamente sin restricciones para este flujo."
            exit 0
          fi

          echo "Detectado Pull Request con destino a 'main'. Ejecutando validación estricta de origen..."

          # 2. Validar que proceda del mismo repositorio (no de un fork)
          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "::error::Violación de seguridad: El Pull Request hacia 'main' no procede del repositorio oficial ($BASE_REPO)."
            exit 1
          fi

          # 3. Validar que la rama origen sea exclusivamente la rama oficial release
          if [ "$HEAD_REF" != "release" ]; then
            echo "::error::Violación del flujo: Los Pull Requests dirigidos a 'main' deben provenir exclusivamente de la rama oficial 'release' (recibido: '$HEAD_REF'). PRs directos desde 'feature/*', 'develop' o ramas de versión no autorizadas están estrictamente prohibidos."
            exit 1
          fi

          echo "Validación superada: La rama '$HEAD_REF' procede del repositorio oficial y corresponde a la rama oficial de Release."

  test:
    name: Pruebas Unitarias y TypeScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobación de tipos TypeScript
        run: npx tsc --noEmit

      - name: Ejecutar pruebas unitarias
        run: npm test

  android-build:
    name: Compilación Android firmada
    needs:
      - validate-release-source
      - test
    if: >-
      ${{
        needs.validate-release-source.result == 'success' &&
        needs.test.result == 'success' &&
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        inputs.build_android == true
      }}
    runs-on: ubuntu-latest
    environment: android-build
    permissions:
      contents: read

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Configurar Expo y EAS
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: 25.3.0

      - name: Configurar artefacto AAB de producciÃ³n
        id: android-config
        shell: bash
        run: |
          echo "artifact_name=ladybarber-v0.1.0-production.aab" >> "$GITHUB_OUTPUT"

      - name: Compilar Android en EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: >-
          eas build
          --platform android
          --profile production
          --non-interactive
          --wait
          --json
          > eas-build-result.json

      - name: Descargar artefacto y registrar evidencia
        id: build-evidence
        shell: bash
        env:
          ARTIFACT_NAME: ${{ steps.android-config.outputs.artifact_name }}
        run: |
          set -Eeuo pipefail

          build_id="$(jq -r 'if type == "array" then .[0].id else .id end' eas-build-result.json)"
          artifact_url="$(jq -r 'if type == "array" then .[0].artifacts.buildUrl else .artifacts.buildUrl end' eas-build-result.json)"
          details_url="$(jq -r 'if type == "array" then .[0].buildDetailsPageUrl else .buildDetailsPageUrl end // empty' eas-build-result.json)"

          if [ -z "$build_id" ] || [ "$build_id" = "null" ]; then
            echo "::error::EAS no devolvio un identificador de build."
            exit 1
          fi
          if [ -z "$artifact_url" ] || [ "$artifact_url" = "null" ]; then
            echo "::error::EAS no devolvio la URL del artefacto firmado."
            exit 1
          fi

          curl --fail --location --silent --show-error "$artifact_url" --output "$ARTIFACT_NAME"

          if [ ! -s "$ARTIFACT_NAME" ]; then
            echo "::error::El artefacto AAB no existe o esta vacio."
            exit 1
          fi

          if ! unzip -tqq "$ARTIFACT_NAME"; then
            echo "::error::El artefacto descargado no es un ZIP integro."
            exit 1
          fi

          bundle_entries="$(mktemp)"
          trap 'rm -f "$bundle_entries"' EXIT
          unzip -Z1 "$ARTIFACT_NAME" > "$bundle_entries"

          if ! grep -Fxq "BundleConfig.pb" "$bundle_entries"; then
            echo "::error::El artefacto no contiene BundleConfig.pb."
            exit 1
          fi
          if ! grep -Fxq "base/manifest/AndroidManifest.xml" "$bundle_entries"; then
            echo "::error::El artefacto no contiene el manifiesto del modulo base."
            exit 1
          fi

          sha256sum "$ARTIFACT_NAME" | tee "$ARTIFACT_NAME.sha256"

          if ! command -v jarsigner >/dev/null 2>&1; then
            echo "::error::jarsigner no esta disponible en el runner para verificar la firma del AAB."
            exit 1
          fi
          LC_ALL=C jarsigner -verify -verbose -certs "$ARTIFACT_NAME" \
            2>&1 | tee "$ARTIFACT_NAME.signature.txt"
          node scripts/build-security.cjs \
            verify-signature-report "$ARTIFACT_NAME.signature.txt"

          if [ ! -s "$ARTIFACT_NAME.signature.txt" ]; then
            echo "::error::No se genero evidencia de verificacion de firma."
            exit 1
          fi

          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
          echo "details_url=$details_url" >> "$GITHUB_OUTPUT"
          {
            echo "### Evidencia EAS Android"
            echo "- Perfil: production"
            echo "- Build ID: $build_id"
            if [ -n "$details_url" ]; then
              echo "- Detalles: $details_url"
            fi
            echo "- Artefacto: $ARTIFACT_NAME"
            echo "- SHA-256: $(cut -d ' ' -f1 "$ARTIFACT_NAME.sha256")"
            echo "- Firma: verificada con jarsigner; evidencia incluida en el artifact"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Conservar artefacto Android firmado
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-production-${{ steps.build-evidence.outputs.build_id }}
          path: |
            ${{ steps.android-config.outputs.artifact_name }}
            ${{ steps.android-config.outputs.artifact_name }}.sha256
            ${{ steps.android-config.outputs.artifact_name }}.signature.txt
          if-no-files-found: error
